<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Меню ПП</title>
<meta name="description" content="Личное меню правильного питания на каждый день: рецепты без глютена, КБЖУ, меню на неделю и список покупок.">
<meta name="theme-color" content="#2f8f5b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7f2; --surface:#ffffff; --surface-2:#f0f3ec; --surface-3:#e3e9de;
  --text:#1c2a21; --muted:#5b6a60; --border:#dde5d8;
  --primary:#2f8f5b; --primary-2:#256f47; --primary-ink:#ffffff; --primary-soft:#e0f2e7;
  --accent:#e0603f; --accent-soft:#fde6df;
  --m-b:#ffe7d3; --m-s:#dcf2e4; --m-l:#fff1c4; --m-d:#ebe4fb;
  --p:#3c7fd6; --f:#d88a1d; --c:#2f8f5b;
  --shadow:0 6px 20px rgba(32,52,38,.07);
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101511; --surface:#182019; --surface-2:#1f2920; --surface-3:#2a362c;
    --text:#e6efe8; --muted:#a2b2a6; --border:#2c392f;
    --primary:#5fcf8e; --primary-2:#47b676; --primary-ink:#0b1a10; --primary-soft:#173424;
    --accent:#ff8c6e; --accent-soft:#3e2219;
    --m-b:#3a2a1c; --m-s:#173424; --m-l:#373015; --m-d:#2a2442;
    --p:#7fb2f5; --f:#f0b45a; --c:#5fcf8e;
    --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#101511; --surface:#182019; --surface-2:#1f2920; --surface-3:#2a362c;
  --text:#e6efe8; --muted:#a2b2a6; --border:#2c392f;
  --primary:#5fcf8e; --primary-2:#47b676; --primary-ink:#0b1a10; --primary-soft:#173424;
  --accent:#ff8c6e; --accent-soft:#3e2219;
  --m-b:#3a2a1c; --m-s:#173424; --m-l:#373015; --m-d:#2a2442;
  --p:#7fb2f5; --f:#f0b45a; --c:#5fcf8e;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.6rem;font-weight:900}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.topbar{max-width:760px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--primary-soft);color:var(--primary-2);font-weight:800;font-size:.8rem;white-space:nowrap}
:root[data-theme="dark"] .pill{color:var(--primary)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:var(--primary)}}

main{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{background:none;border:0;border-radius:14px;padding:6px 2px;display:grid;justify-items:center;gap:2px;font-size:.72rem;font-weight:800;color:var(--muted);min-height:52px}
.nav button .ic{font-size:1.35rem;line-height:1}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--text)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);font-weight:800}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.icon-btn{width:44px;height:44px;flex:none;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center;font-size:1.05rem;font-weight:900}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.icon-btn.sm{width:36px;height:36px;border-radius:11px;font-size:.9rem}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

.head{display:flex;align-items:center;gap:10px}
.head .grow{flex:1;min-width:0;text-align:center}

.emo{width:56px;height:56px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:1.9rem;background:var(--surface-2)}
.emo.big{width:68px;height:68px;font-size:2.4rem;border-radius:20px}
.m-b{background:var(--m-b)}.m-s{background:var(--m-s)}.m-l{background:var(--m-l)}.m-d{background:var(--m-d)}

.sum .big{font-size:2rem;font-weight:900;line-height:1.1}
.sum .big small{font-size:1rem;color:var(--muted);font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:12px 0 6px}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.macro{background:var(--surface-2);border-radius:14px;padding:10px}
.macro b{display:block;font-size:1.1rem}
.macro .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

.slot{display:flex;align-items:center;gap:10px;padding:12px}
.slot-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.slot-main b{display:block;font-size:1.02rem;font-weight:800;overflow-wrap:anywhere}
.slot .meta,.rcard .meta{font-size:.84rem;color:var(--muted)}
.slot-actions{display:flex;gap:6px;flex:none}
.slot.eaten .slot-main{opacity:.55}
.slot.eaten b{text-decoration:line-through}
@media (max-width:420px){.slot{flex-wrap:wrap}.slot-actions{width:100%;justify-content:flex-end}}

.tip{display:flex;gap:12px;align-items:flex-start;background:var(--primary-soft);border:0;box-shadow:none}
.welcome{background:var(--m-l);border:0;box-shadow:none}

.week-grid{display:grid;gap:12px}
@media (min-width:720px){.week-grid{grid-template-columns:1fr 1fr}}
.wday.today{outline:2px solid var(--primary)}
.wday-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.wrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--border)}
.wrow:first-of-type{border-top:0}
.wlabel{width:70px;flex:none;font-size:.78rem;font-weight:800;color:var(--muted)}
.wname{flex:1;min-width:0;background:none;border:0;padding:4px 0;text-align:left;font-weight:700;overflow-wrap:anywhere}
.wname:hover{color:var(--primary)}
.wk{font-size:.8rem;color:var(--muted);white-space:nowrap}

.search{width:100%;min-height:48px;padding:12px 16px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border-radius:99px;padding:8px 14px;border:1px solid var(--border);background:var(--surface);font-weight:800;font-size:.88rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.rcard{position:relative;display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.rcard:hover{border-color:var(--primary)}
.rcard b{display:block;font-weight:800;overflow-wrap:anywhere}
.rcard .heart{position:absolute;top:6px;right:8px;font-size:.85rem}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty .e{font-size:2.6rem}

dialog{border:0;padding:0;border-radius:24px;width:min(640px,calc(100vw - 24px));max-height:90vh;background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,14,.5)}
@media (max-width:600px){dialog{margin:auto 0 0;width:100%;max-width:100%;max-height:92vh;border-radius:24px 24px 0 0}}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg-head{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--border)}
.dlg-head .grow{flex:1;min-width:0}
.dlg-body{padding:16px;overflow:auto;display:grid;gap:16px}
.kbju{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kbju div{background:var(--surface-2);border-radius:14px;padding:8px;text-align:center}
.kbju b{display:block;font-size:1.15rem}
.kbju span{font-size:.75rem;color:var(--muted);font-weight:700}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px}
.stepper button{width:38px;height:38px;border-radius:11px;border:0;background:var(--surface);font-weight:900;font-size:1.1rem}
.stepper span{min-width:72px;text-align:center;font-weight:800;font-size:.9rem}
.ing{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.ing li span:last-child{font-weight:800;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps button{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface-2);border:0;border-radius:14px;padding:12px}
.steps button::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:900;font-size:.85rem}
.steps button.done{opacity:.5;text-decoration:line-through}
.steps button.done::before{content:'✓'}
.cook .steps button,.cook .ing li{font-size:1.2rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:4px 10px;border-radius:99px;background:var(--surface-2);font-size:.8rem;font-weight:700}
.srow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface-2);border:2px solid transparent;border-radius:16px;padding:8px 10px}
.srow:hover{border-color:var(--primary)}
.srow.cur{border-color:var(--primary);background:var(--primary-soft)}
.srow .emo{width:44px;height:44px;font-size:1.5rem;border-radius:12px}
.srow b{display:block}

.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:800;font-size:.88rem;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.shop-dept h3{margin-bottom:6px}
.chk{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;accent-color:var(--primary);flex:none}
.chk .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.chk .q{font-weight:800;white-space:nowrap}
.chk.on .nm,.chk.on .q{text-decoration:line-through;color:var(--muted)}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0}

.field{display:grid;gap:6px}
.field label,.lbl{font-weight:800;font-size:.9rem}
.input,select.input{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{background:var(--primary-soft);border-radius:14px;padding:12px;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  .nav,.no-print,.topbar,.icon-btn,.toast{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;padding:8px}
  .week-grid{grid-template-columns:1fr 1fr;gap:6px}
  .wrow{padding:2px 0}
  .wday.today{outline:0}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span aria-hidden="true">🥗</span> Меню ПП</div>
  <span class="pill" title="Все рецепты без пшеницы, ржи и ячменя">🌾 Без глютена</span>
</div>
<main id="view" class="stack"></main>
<nav class="nav" aria-label="Разделы">
  <div class="nav-in">
    <button data-a="nav" data-v="today"><span class="ic" aria-hidden="true">🍽️</span>Сегодня</button>
    <button data-a="nav" data-v="week"><span class="ic" aria-hidden="true">📅</span>Неделя</button>
    <button data-a="nav" data-v="recipes"><span class="ic" aria-hidden="true">📖</span>Рецепты</button>
    <button data-a="nav" data-v="shop"><span class="ic" aria-hidden="true">🛒</span>Покупки</button>
    <button data-a="nav" data-v="settings"><span class="ic" aria-hidden="true">⚙️</span>Настройки</button>
  </div>
</nav>
<dialog id="dlg" aria-label="Подробности"><div id="dlg-body" class="dlg"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Рецепты: [id, приём, эмодзи, название, минуты, ккал, Б, Ж, У, ингредиенты "название|кол-во|ед|отдел;…", шаги "…|…"] =====
   Отделы: veg, meat, dairy, grain, groc, home (есть дома — не попадает в список покупок) */
const RAW = [
['b1','b','🍳','Омлет со шпинатом и помидорами',15,330,19,19,21,'Яйца|2|шт|dairy;Молоко 2,5%|50|мл|dairy;Шпинат|40|г|veg;Помидор|100|г|veg;Рисовые хлебцы (без глютена)|2|шт|grain;Оливковое масло|5|мл|groc;Соль, перец|0|по вкусу|home','Взбейте яйца с молоком, посолите.|Обжарьте шпинат 1 минуту на масле, добавьте нарезанный помидор.|Залейте яйцами, накройте крышкой и готовьте 5–6 минут на слабом огне.|Подавайте с рисовыми хлебцами.'],
['b2','b','🥣','Овсянка без глютена с ягодами',10,340,12,8,55,'Овсяные хлопья (без глютена)|50|г|grain;Молоко 2,5%|150|мл|dairy;Ягоды (свежие или замороженные)|80|г|veg;Мёд|10|г|groc','Залейте хлопья молоком и доведите до кипения.|Варите 4–5 минут, помешивая.|Добавьте ягоды и мёд.'],
['b3','b','🫐','Творог с ягодами и орехами',5,330,30,14,22,'Творог 5%|180|г|dairy;Ягоды (свежие или замороженные)|80|г|veg;Грецкие орехи|10|г|groc;Мёд|10|г|groc','Выложите творог в миску.|Добавьте ягоды, рубленые орехи и полейте мёдом.'],
['b4','b','🥛','Гречневая каша с молоком',20,330,15,7,52,'Гречка|60|г|grain;Молоко 2,5%|200|мл|dairy;Соль|0|по вкусу|home','Промойте гречку, залейте 120 мл воды, посолите.|Варите под крышкой 15 минут.|Залейте горячим молоком.'],
['b5','b','🥞','Сырники на рисовой муке',25,420,38,17,28,'Творог 5%|200|г|dairy;Яйца|1|шт|dairy;Рисовая мука|30|г|grain;Сметана 15%|30|г|dairy;Оливковое масло|5|мл|groc;Ванилин|0|по вкусу|home','Разомните творог с яйцом и ванилином.|Добавьте рисовую муку, слепите 4–5 сырников.|Обжарьте на смазанной маслом сковороде по 3–4 минуты с каждой стороны на среднем огне.|Подавайте со сметаной.'],
['b6','b','🥑','Яйца пашот с авокадо на хлебцах',15,380,16,25,22,'Яйца|2|шт|dairy;Авокадо|60|г|veg;Гречневые хлебцы (без глютена)|2|шт|grain;Помидоры черри|60|г|veg;Лимон|0.25|шт|veg;Соль, перец|0|по вкусу|home','Разомните авокадо с лимонным соком, солью и перцем.|Сварите яйца пашот: 3 минуты в едва кипящей воде.|Намажьте хлебцы авокадо, сверху выложите яйца и черри.'],
['b7','b','🍌','Смузи-боул банан и шпинат',10,310,16,8,44,'Банан|1|шт|veg;Шпинат|30|г|veg;Греческий йогурт|150|г|dairy;Семена чиа|10|г|groc','Взбейте в блендере банан, шпинат и йогурт.|Перелейте в миску и посыпьте семенами чиа.'],
['b8','b','🎃','Пшённая каша с тыквой',30,340,12,7,58,'Пшено|50|г|grain;Тыква|150|г|veg;Молоко 2,5%|150|мл|dairy;Мёд|10|г|groc','Промойте пшено кипятком несколько раз.|Тыкву нарежьте кубиками и варите в 100 мл воды 10 минут.|Добавьте пшено и молоко, варите 15–20 минут.|Подавайте с мёдом.'],
['b9','b','🥭','Чиа-пудинг с манго',5,320,12,14,36,'Семена чиа|30|г|groc;Молоко 2,5%|200|мл|dairy;Манго|100|г|veg;Мёд|5|г|groc','Вечером смешайте чиа с молоком и мёдом.|Уберите в холодильник на ночь (минимум на 4 часа).|Утром добавьте кубики манго.'],

/* ===== Даты ===== */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addD = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return iso(d); };
const mon = s => addD(s, -((pd(s).getDay()+6)%7));
const TODAY = iso(new Date());
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const fmtDay = s => { const d = pd(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const isWknd = s => { const g = pd(s).getDay(); return g === 0 || g === 6; };
const weekRange = ws => { const a = pd(ws), b = pd(addD(ws,6)); return a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MON[b.getMonth()]}` : `${fmtDay(ws)} – ${fmtDay(addD(ws,6))}`; };

/* ===== Утилиты ===== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (x,d=1) => Number(x).toLocaleString('ru-RU', {maximumFractionDigits:d});
const r0 = x => Math.round(x);
const stem = w => w.length >= 5 ? w.slice(0,4) : w; // грубая основа слова: «курица» → «кури»
function fmtQty(q,u){
  if (u === 'по вкусу') return 'по вкусу';
  if (u === 'г' || u === 'мл') {
    let v = q >= 50 ? Math.round(q/10)*10 : Math.round(q/5)*5;
    if (!v) v = Math.max(1, Math.round(q));
    if (v >= 1000) return num(v/1000, 2) + (u === 'г' ? ' кг' : ' л');
    return v + ' ' + u;
  }
  const v = q < 0.5 ? Math.max(0.25, Math.round(q*4)/4) : Math.round(q*2)/2;
  return num(v, 2) + ' ' + u;
}
function toast(msg){

function slotsCfg(){
  const n = +S.settings.meals;
  if (n === 3) return [{k:'b',m:'b',name:'Завтрак',share:.30},{k:'l',m:'l',name:'Обед',share:.40},{k:'d',m:'d',name:'Ужин',share:.30}];
  if (n === 4) return [{k:'b',m:'b',name:'Завтрак',share:.25},{k:'l',m:'l',name:'Обед',share:.35},{k:'s2',m:'s',name:'Полдник',share:.15},{k:'d',m:'d',name:'Ужин',share:.25}];
  return [{k:'b',m:'b',name:'Завтрак',share:.25},{k:'s1',m:'s',name:'Перекус',share:.10},{k:'l',m:'l',name:'Обед',share:.35},{k:'s2',m:'s',name:'Полдник',share:.10},{k:'d',m:'d',name:'Ужин',share:.20}];
}
const target = sl => S.settings.goal * sl.share;
// Размер порции подгоняется под калорийность слота — так день укладывается в цель
const fac = (r,t) => Math.min(2, Math.max(0.5, Math.round(t / r.k * 10) / 10));
function excl(r){
  const terms = String(S.settings.exclude||'').toLowerCase().replace(/ё/g,'е').split(',').map(s => s.trim()).filter(Boolean).map(stem);
  return terms.some(t => r.hay.includes(t));
}
function candidates(m, dateS, t){
  let c = RECIPES.filter(r => r.m === m && !excl(r));
  const lim = isWknd(dateS) ? +S.settings.tWknd : +S.settings.tWeek;
  const a = c.filter(r => r.t <= lim); if (a.length) c = a;
  const b = c.filter(r => { const q = t / r.k; return q >= .65 && q <= 1.6; }); if (b.length) c = b;
  return c;
}
function pick(sl, dateS, usedW, usedD, avoid){
  const t = target(sl);
  const c = candidates(sl.m, dateS, t);
  if (!c.length) return null;
  let pool = c.filter(r => r.id !== avoid && !usedD.has(r.id) && (usedW[r.id]||0) < 2);
  if (!pool.length) pool = c.filter(r => r.id !== avoid);
  if (!pool.length) pool = c;
  const ws = pool.map(r => (S.fav[r.id] ? 3 : 1) * ((usedW[r.id]||0) ? .35 : 1) / (1 + Math.abs(1 - t/r.k) * 2));
  let x = Math.random() * ws.reduce((a,b) => a+b, 0);
  for (let i = 0; i < pool.length; i++) { x -= ws[i]; if (x <= 0) return pool[i].id; }
  return pool[pool.length-1].id;
}
function genWeek(ws, mode){ // mode: 'missing' — заполнить пустое, 'regen' — пересобрать всё, кроме закреплённого
  const cfg = slotsCfg();
  const days = [...Array(7)].map((_,i) => addD(ws,i));
  const keep = (d,k) => { const s = S.plans[d] && S.plans[d][k]; if (!s || !R[s.id] || excl(R[s.id])) return false; return mode === 'missing' || s.pin; };
  const usedW = {}; let changed = false;
  days.forEach(d => cfg.forEach(sl => { if (keep(d, sl.k)) { const id = S.plans[d][sl.k].id; usedW[id] = (usedW[id]||0) + 1; } }));
  days.forEach(d => {
    S.plans[d] = S.plans[d] || {};
    const usedD = new Set(cfg.filter(sl => keep(d, sl.k)).map(sl => S.plans[d][sl.k].id));
    cfg.forEach(sl => {
      if (keep(d, sl.k)) return;
      const old = S.plans[d][sl.k];
      const id = pick(sl, d, usedW, usedD, mode === 'regen' && old ? old.id : null);
      changed = true;
      if (!id) { delete S.plans[d][sl.k]; return; }
      S.plans[d][sl.k] = {id, pin:false, eaten:false};
      usedW[id] = (usedW[id]||0) + 1; usedD.add(id);
    });
  });
  if (changed) save();
}
function dayItems(d){
  return slotsCfg().map(sl => {
    const s = S.plans[d] && S.plans[d][sl.k];
    const r = s && R[s.id];
    return {sl, s, r, x: r ? fac(r, target(sl)) : 1};
  });
}
function totals(items, eatenOnly){
  return items.reduce((a,it) => {
    if (!it.r || (eatenOnly && !it.s.eaten)) return a;
    a.k += it.r.k*it.x; a.p += it.r.p*it.x; a.f += it.r.f*it.x; a.c += it.r.c*it.x; return a;
  }, {k:0,p:0,f:0,c:0});
}

  const words = filt.q.trim().toLowerCase().replace(/ё/g,'е').split(/\s+/).filter(Boolean).map(stem);
  const list = RECIPES.filter(r => {
    if (['b','l','d','s'].includes(filt.f) && r.m !== filt.f) return false;
    if (filt.f === 'fav' && !S.fav[r.id]) return false;
    if (filt.f === 'fast' && r.t > 20) return false;
    if (filt.f === 'veg' && !isVeg(r)) return false;
    if (words.length && !words.every(w => r.hay.includes(w))) return false;
    return true;
  });
  document.getElementById('rlist').innerHTML = list.length
    ? `<p class="small muted" style="margin:0 0 10px">Найдено: ${list.length}</p><div class="rgrid">${list.map(r => `
      <button class="rcard" data-a="open" data-id="${r.id}" data-mult="1">
        <span class="emo m-${r.m}" aria-hidden="true">${r.e}</span>
        <span><b>${esc(r.n)}</b><span class="meta">${MEALS[r.m]} · ⏱ ${r.t} мин · ${r.k} ккал${excl(r) ? ' · 🚫 исключено' : ''}</span></span>
        ${S.fav[r.id] ? '<span class="heart" aria-label="В избранном">❤️</span>' : ''}
      </button>`).join('')}</div>`
    : `<div class="empty"><div class="e">🔍</div><p>Ничего не нашлось. Попробуйте другой продукт или сбросьте фильтр.</p></div>`;
}

/* ===== Покупки ===== */
function shopKey(){ return shopP === 'today' ? mon(TODAY) : curWeek; }
function shopData(){
  const k = shopKey();
  S.shop[k] = S.shop[k] || {c:{}, extra:[]};
  return S.shop[k];
}
function shopDays(){
  if (shopP === 'today') return [TODAY];
  const days = [...Array(7)].map((_,i) => addD(curWeek,i));
  return shopP === 'rest' ? days.filter(d => d >= TODAY) : days;
}
function shopList(){
  genWeek(curWeek, 'missing'); genWeek(mon(TODAY), 'missing');
  const people = Math.max(1, +S.settings.people || 1);
  const map = {}, home = new Set();
  shopDays().forEach(d => dayItems(d).forEach(({r,x}) => {
    if (!r) return;
    r.ing.forEach(i => {
      if (i.d === 'home' || !i.q) { home.add(i.n); return; }
      const key = i.n + '|' + i.u;
      (map[key] = map[key] || {key, n:i.n, u:i.u, d:i.d, q:0}).q += i.q * x * people;
    });
  }));
  return {items:Object.values(map), home:[...home]};
}
function shopQty(q,u){ return (u === 'шт' || u === 'зубч.') ? fmtQty(Math.ceil(q*2)/2, u) : fmtQty(q,u); }

function calcNorm(){
  const s = S.settings;
  const bmr = 10*s.w + 6.25*s.h - 5*s.age + (s.sex === 'm' ? 5 : -161);
  const k = s.aim === 'lose' ? .85 : s.aim === 'gain' ? 1.1 : 1;
  return Math.round(bmr * s.act * k / 10) * 10;
}

function setSlot(d, k, id){
  S.plans[d] = S.plans[d] || {};
  const old = S.plans[d][k];
  S.plans[d][k] = {id, pin: old ? old.pin : false, eaten:false};
  save();
}
async function setWake(on){
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch(e) {}
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => { setWake(false); M = null; render(); });

/* ===== События ===== */
const H = {
  nav: b => { view = b.dataset.v; render(true); },
  day: b => { const d = +b.dataset.d; curDate = d ? addD(curDate, d) : TODAY; render(); },
  week: b => { curWeek = addD(curWeek, +b.dataset.d); render(); },
  'welcome-ok': () => { S.welcome = false; save(); render(); },
  'welcome-calc': () => { S.welcome = false; save(); view = 'settings'; render(true); setTimeout(() => document.getElementById('sex')?.scrollIntoView({block:'center'}), 50); },
  open: b => openModal({type:'recipe', id:b.dataset.id, mult:+b.dataset.mult || 1, date:b.dataset.date, slot:b.dataset.slot, cook:false, done:new Set()}),
  eat: b => { const s = S.plans[b.dataset.date][b.dataset.slot]; s.eaten = !s.eaten; save(); render(); },
  pin: b => { const s = S.plans[b.dataset.date][b.dataset.slot]; s.pin = !s.pin; save(); render(); toast(s.pin ? '📌 Блюдо закреплено' : 'Закрепление снято'); },
  swap: b => openModal({type:'swap', date:b.dataset.date, slot:b.dataset.slot}),
  'swap-pick': b => { setSlot(M.date, M.slot, b.dataset.id); toast('Блюдо заменено'); dlg.close(); },
  'swap-random': () => {
    const sl = slotsCfg().find(s => s.k === M.slot), cur = S.plans[M.date] && S.plans[M.date][M.slot];
    const ws = mon(M.date), usedW = {}, usedD = new Set();
    [...Array(7)].forEach((_,i) => { const p = S.plans[addD(ws,i)] || {}; Object.values(p).forEach(s => { usedW[s.id] = (usedW[s.id]||0) + 1; if (addD(ws,i) === M.date) usedD.add(s.id); }); });
    const id = pick(sl, M.date, usedW, usedD, cur && cur.id);

    dlg.close();
  },
  regen: () => { if (confirm('Составить новое меню на эту неделю? Закреплённые 📌 блюда останутся.')) { genWeek(curWeek, 'regen'); render(); toast('🎲 Новое меню готово'); } },
  print: () => window.print(),
  filter: b => { filt.f = b.dataset.f; renderRecipes(); },
  close: () => dlg.close(),
  pm: b => { M.mult = Math.min(10, Math.max(.5, Math.round((M.mult + +b.dataset.d) * 2) / 2)); renderModal(); },
  step: b => { const i = +b.dataset.i; M.done.has(i) ? M.done.delete(i) : M.done.add(i); renderModal(); },
  fav: () => { if (S.fav[M.id]) delete S.fav[M.id]; else S.fav[M.id] = true; save(); renderModal(); },
  cook: () => { M.cook = !M.cook; setWake(M.cook); renderModal(); if (M.cook) toast('Экран не будет гаснуть'); },
  'to-today': () => {
    const r = R[M.id]; genWeek(mon(TODAY), 'missing');

    if (!sl) { toast('В вашем режиме нет перекусов — включите 4–5 приёмов пищи'); return; }
    setSlot(TODAY, sl.k, r.id); toast(`Добавлено на сегодня: ${sl.name.toLowerCase()}`); dlg.close();
  },
  'shop-p': b => { shopP = b.dataset.p; render(); },
  'shop-reset': () => { const sd = shopData(); sd.c = {}; sd.extra.forEach(e => e.done = false); save(); render(); },
  'shop-copy': () => {
    const {items} = shopList(), sd = shopData();
    let txt = 'Список покупок 🛒\n';
    Object.keys(DEPTS).forEach(d => {
      const l = items.filter(i => i.d === d && !sd.c[i.key]).sort((a,b) => a.n.localeCompare(b.n,'ru'));
      if (l.length) txt += `\n${DEPTS[d]}\n` + l.map(i => `— ${i.n} — ${shopQty(i.q,i.u)}`).join('\n') + '\n';
    });
    const ex = sd.extra.filter(e => !e.done); if (ex.length) txt += '\n✍️ Другое\n' + ex.map(e => '— ' + e.t).join('\n') + '\n';

  export: () => {

    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  reset: () => { if (confirm('Удалить все настройки, меню, избранное и списки покупок?')) { try { localStorage.removeItem(LS); } catch(e) {} S = clone(DEF); applyTheme(); render(true); toast('Данные сброшены'); } }
};
function copy(txt){
  const done = () => toast('📋 Список скопирован');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fallback());
  else fallback();
  function fallback(){ const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch(e) { toast('Не удалось скопировать'); } t.remove(); }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && H[b.dataset.a]) H[b.dataset.a](b, e); });
document.addEventListener('input', e => { if (e.target.id === 'q') { filt.q = e.target.value; renderRList(); } });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.set) {
    const k = el.dataset.set;
    if (k === 'theme') { S.theme = el.value; applyTheme(); }
    else if (k === 'exclude' || k === 'sex' || k === 'aim') S.settings[k] = el.value;
    else {
      let v = parseFloat(el.value); if (isNaN(v)) { render(); return; }
      if (k === 'goal') v = Math.min(4000, Math.max(1000, Math.round(v)));
      S.settings[k] = v;
    }
    save(); render();
    if (k === 'goal') toast(`Цель: ${num(S.settings.goal)} ккал — порции пересчитаны`);
    if (k === 'exclude') toast('Меню обновится с учётом исключений');
  }
  if (el.dataset.shop !== undefined) { const sd = shopData(); if (el.checked) sd.c[el.dataset.shop] = true; else delete sd.c[el.dataset.shop]; save(); el.closest('.chk').classList.toggle('on', el.checked); }
  if (el.dataset.extra !== undefined) { shopData().extra[+el.dataset.extra].done = el.checked; save(); el.closest('.chk').classList.toggle('on', el.checked); }
  if (el.id === 'imp' && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const o = JSON.parse(fr.result);
        if (!o || typeof o !== 'object' || !o.settings) throw 0;
        S = {...clone(DEF), ...o, settings:{...DEF.settings, ...o.settings}}; save(); applyTheme(); render(); toast('Копия загружена');
      } catch(err) { toast('Не удалось прочитать файл'); }
    };
    fr.readAsText(el.files[0]);
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'shop-add') return;
  e.preventDefault();
  const v = e.target.t.value.trim(); if (!v) return;
  shopData().extra.push({t:v, done:false}); save(); render();
  document.querySelector('#shop-add input')?.focus();
});
function applyTheme(){ if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme); }

applyTheme();
render();
</script>
</body>
